packages:
  - "apps/*"
  - "packages/*"

# Supply-chain hardening (pnpm >= 10.21). Semgrep p/owasp-top-ten checks these.
# Wait 7 days before installing a newly published version.
minimumReleaseAge: 10080
# Refuse an update whose provenance or trust evidence is weaker than the version it replaces.
trustPolicy: no-downgrade
# Transitive dependencies may only come from the registry (no git or tarball URLs).
blockExoticSubdeps: true
# pnpm 10 blocks install scripts by default; only these reviewed packages may run them.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - argon2
  - esbuild
  - msgpackr-extract
# rollup publishes often; its platform binaries are exact optional deps, so pnpm cannot fall back
# to an older mature version by itself. Pin to a release older than minimumReleaseAge; Dependabot bumps it.
overrides:
  rollup: 4.64.7
# Security-fix exception (2026-10-22): vitest 4.1.12 fixes GHSA advisories in @vitest/mocker and is
# 6 days old. Dev-only (tests never ship in the image). Remove this exclusion after 2026-10-23.
minimumReleaseAgeExclude:
  - vitest
  - "@vitest/*"
# Old releases published before the maintainer enabled provenance; pinned exact versions, reviewed 2026-10-22.
trustPolicyExclude:
  - "semver@6.3.1"
