name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule: [{ cron: "0 3 * * *" }]
permissions: { contents: read, id-token: write, security-events: write }
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres: { image: postgres:16-alpine, env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }, ports: ["5432:5432"], options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10 }
      redis: { image: redis:7-alpine, ports: ["6379:6379"] }
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-chars
      APP_URL: http://localhost:5173
      INTEGRATIONS_MODE: fake
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm db:migrate
      - run: pnpm lint && pnpm typecheck
      - run: pnpm test
      - name: Migrations are reversible
        run: pnpm --filter @octavolab/db exec prisma migrate status
      - run: pnpm build
      - name: E2E (390/768/1024/1440 + axe)
        run: |
          pnpm --filter api start & pnpm --filter web preview --port 5173 &
          sleep 5
          E2E_BASE_URL=http://localhost:5173 API_URL=http://localhost:3000 pnpm exec playwright install --with-deps chromium webkit && pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report }
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
      - name: semgrep (OWASP)
        uses: semgrep/semgrep-action@v1
        with: { config: "p/owasp-top-ten p/typescript" }
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1
        with: { scan-args: "--lockfile=pnpm-lock.yaml --fail-on-vuln" }
      - name: build image
        run: docker build -f infra/Dockerfile -t app:ci .
      - name: trivy
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: app:ci, severity: "HIGH,CRITICAL", exit-code: "1" }
  deploy-staging:
    needs: [quality, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: ${{ secrets.AWS_ROLE_STAGING }}, aws-region: eu-west-2 }
      - name: lightsailctl plugin
        run: curl -fsSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o /usr/local/bin/lightsailctl && chmod +x /usr/local/bin/lightsailctl
      - run: PROJECT_NAME=${{ vars.PROJECT_NAME }} infra/deploy.sh staging
      - run: infra/smoke.sh ${{ vars.STAGING_URL }}
  deploy-prod:
    needs: [quality, security]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production   # requires manual approval in GitHub + Jaime's approval in chat (N07)
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: ${{ secrets.AWS_ROLE_PROD }}, aws-region: eu-west-2 }
      - name: lightsailctl plugin
        run: curl -fsSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o /usr/local/bin/lightsailctl && chmod +x /usr/local/bin/lightsailctl
      - run: PROJECT_NAME=${{ vars.PROJECT_NAME }} infra/deploy.sh prod
      - run: infra/smoke.sh ${{ vars.PROD_URL }}
  zap-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: zaproxy/action-baseline@v0.13.0
        with: { target: ${{ vars.STAGING_URL }} }
