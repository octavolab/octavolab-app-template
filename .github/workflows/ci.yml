name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule: [{ cron: "0 3 * * *" }]
# Least privilege: the workflow token can only read. `id-token: write` (OIDC to AWS) is granted to the deploy jobs only.
permissions: { contents: read }
jobs:
  quality:
    runs-on: ubuntu-latest
    # A hung step (the E2E run hung once on 22 Oct 2026) fails the job instead of holding the runner for 6 hours.
    timeout-minutes: 30
    services:
      postgres: { image: "postgres:16-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815", env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }, ports: ["5432:5432"], options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10 }
      redis: { image: "redis:7-alpine@sha256:892022f9f18c26c92c30e15194d132f90044af87b94a491a75429bbc3982eab1", ports: ["6379:6379"] }
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-chars
      APP_URL: http://localhost:5173
      OPS_EMAIL: ops@ci.invalid
      INTEGRATIONS_MODE: fake
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Workspace packages must be built (dist + .d.ts) before apps/api typechecks against them.
      - run: pnpm db:generate && pnpm --filter "./packages/**" build && pnpm db:migrate
      - name: Migrations replay on an empty PostgreSQL (PGlite) in order
        run: pnpm --filter @octavolab/db validate:sql
      - run: pnpm lint && pnpm typecheck
      - name: Integration tests against PostgreSQL (real database, migrations applied)
        run: INTEGRATION=1 pnpm --filter api test:int
      - run: pnpm test
      - name: Deploy env merge tests (infra/deploy_env.py)
        run: python3 -m unittest infra/test_deploy_env.py
      - name: Migrations exist and are applied (Prisma has no down migrations; rollback plan per migration in its folder)
        run: test -n "$(ls packages/db/prisma/migrations 2>/dev/null)" && pnpm --filter @octavolab/db exec prisma migrate status && pnpm --filter @octavolab/db exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: pnpm build
      # The E2E step hung twice on 22 Oct 2026 (runs of PR #21 and PR #22) until the job timeout; the browser install
      # (apt) and the test run now have their own step timeouts so the next hang names its step.
      - name: Install Playwright browsers
        timeout-minutes: 10
        # E2E hangs (22 and 23 Oct 2026): the network was fine ("Fetched 12.5 MB in 1s") and the step then sat silent
        # until the timeout. Playwright runs `sudo sh -c "apt-get install -y ..."`, and sudo drops DEBIAN_FRONTEND, so a
        # package's debconf question can wait on stdin forever. The system deps are therefore installed by us as root
        # with DEBIAN_FRONTEND=noninteractive and stdin closed; apt also gets a read timeout and retries. If it still
        # hangs, `timeout` stops it at 8 min and a watcher prints the process tree at 7 min to show what was waiting.
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-retries >/dev/null
          # Watcher: if the install is still running after 7 min, print what apt/dpkg is doing before `timeout` kills it.
          ( sleep 420; echo "::group::process tree after 7 min"; ps -ef --forest | grep -E "apt|dpkg|debconf|frontend|postinst|http" | grep -v grep; echo "::endgroup::" ) &
          WATCH=$!
          if ! sudo env "PATH=$PATH" DEBIAN_FRONTEND=noninteractive timeout 480 pnpm exec playwright install-deps chromium webkit < /dev/null; then
            echo "::error title=Playwright system deps::install-deps failed or timed out after 8 min (see the process tree group above)"
            exit 1
          fi
          kill "$WATCH" 2>/dev/null || true
          pnpm exec playwright install chromium webkit < /dev/null
      - name: E2E (390/768/1024/1440 + axe); vite preview proxies /api to the API on :3000
        timeout-minutes: 15
        run: |
          # Seed and 2FA key for this run only: random values, never committed (gitleaks stays clean).
          export SEED_ADMIN_PASSWORD="$(openssl rand -base64 24)" SEED_CUSTOMER_PASSWORD="$(openssl rand -base64 24)" TOTP_ENC_KEY="$(openssl rand -base64 32)"
          pnpm db:seed
          pnpm --filter api start & pnpm --filter web preview --port 5173 --strictPort &
          ready() { curl -fsS --max-time 2 localhost:3000/api/health >/dev/null && curl -fsS --max-time 2 localhost:5173 >/dev/null; }
          for i in $(seq 1 60); do ready && break; sleep 1; done
          ready || { echo "API or web preview did not start in 60 s"; exit 1; }
          E2E_BASE_URL=http://localhost:5173 API_URL=http://localhost:3000 pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: playwright-report, path: playwright-report }
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      # gitleaks-action requires a paid GITLEAKS_LICENSE for organisation repos; the CLI in its official image does not.
      - name: gitleaks (CLI, full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact -v
      # osv-scanner exits non-zero when it finds vulnerabilities; there is no --fail-on-vuln flag.
      - name: osv-scanner (pnpm lockfile)
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v1.9.1 --lockfile=/src/pnpm-lock.yaml
      - name: build image (git SHA baked in, as infra/deploy.sh does)
        run: docker build -f infra/Dockerfile --build-arg "GIT_SHA=$(git rev-parse --short=7 HEAD)" -t app:ci .
      # Boot the real image against PostgreSQL: proves migrate deploy and server start exactly as in Lightsail, with
      # production-strength secrets generated for this run only (the API refuses weak ones in production).
      - name: boot image (migrate + health + version + create-owner + fail-closed config)
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short=7 HEAD)"
          DB_PW="$(openssl rand -hex 24)"
          DB_URL="postgresql://app:${DB_PW}@db:5432/app"
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_USER=app -e POSTGRES_PASSWORD="$DB_PW" -e POSTGRES_DB=app "postgres:16-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815"
          for i in $(seq 1 30); do docker exec db pg_isready -U app && break; sleep 2; done
          COMMON=(-e NODE_ENV=production -e INTEGRATIONS_MODE=Fake -e DATABASE_URL="$DB_URL" -e TOTP_ENC_KEY="$(openssl rand -base64 32)" -e REQUIRE_PRIVILEGED_2FA=true -e APP_URL=http://localhost:3000 -e OPS_EMAIL=ops@ci.invalid)
          docker run -d --name app --network ci -p 3000:3000 "${COMMON[@]}" -e SESSION_SECRET="$(openssl rand -base64 48)" app:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/health > /tmp/h.json && grep -q '"ok":true' /tmp/h.json && break; sleep 2; done
          docker logs app 2>&1 | tail -20
          python3 -c "import json,sys; h=json.load(open('/tmp/h.json')); assert h['ok'] is True and h['version']==sys.argv[1] and h['mode']=='fake', h" "$SHA"
          # grep without -q reads all input: with -q it exits at the first match and, under pipefail, docker logs dies of
          # SIGPIPE (exit 141) whenever the log is longer than one pipe buffer (run 39937556839).
          docker logs app 2>&1 | grep '"event":"startup".*"integrationsMode":"fake"' > /dev/null
          docker exec app sh -c 'test ! -e /usr/local/bin/npm && ! ls node_modules/.pnpm | grep -qE "^(esbuild|vite|typescript)@"'
          # One-shot create-owner: password on stdin only; a second run never modifies the existing user (exit 3).
          OWNER_PW="$(openssl rand -base64 24)"
          printf '%s\n' "$OWNER_PW" | docker run --rm -i --network ci -e DATABASE_URL="$DB_URL" app:ci node apps/api/dist/cli/create-owner.js --email owner@ci.invalid
          set +e; printf '%s\n' "$OWNER_PW" | docker run --rm -i --network ci -e DATABASE_URL="$DB_URL" app:ci node apps/api/dist/cli/create-owner.js --email owner@ci.invalid; rc=$?; set -e
          test "$rc" -eq 3
          # Fail closed: a weak secret or a leftover BOOTSTRAP_* variable stops the process at boot (non-zero, variable named).
          set +e
          out="$(docker run --rm --network ci "${COMMON[@]}" -e SESSION_SECRET=change-me-32-chars-minimum-random app:ci node apps/api/dist/server.js 2>&1)"; rc1=$?
          out2="$(docker run --rm --network ci "${COMMON[@]}" -e SESSION_SECRET="$(openssl rand -base64 48)" -e BOOTSTRAP_OWNER_EMAIL=x@ci.invalid app:ci node apps/api/dist/server.js 2>&1)"; rc2=$?
          set -e
          test "$rc1" -ne 0 && grep -q SESSION_SECRET <<<"$out" && ! grep -q change-me <<<"$out"
          test "$rc2" -ne 0 && grep -q BOOTSTRAP_OWNER_EMAIL <<<"$out2"
      - name: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: app:ci, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
  semgrep:
    # semgrep/semgrep-action is archived; the official container runs the CLI directly.
    runs-on: ubuntu-latest
    container: { image: "semgrep/semgrep@sha256:3db5c7af55eb1f512eac0abf0ab69a97b52c74b5e9a27314c221aee1a78d7ab2" } # latest as of 2026-10-22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: semgrep scan --config p/owasp-top-ten --error
  deploy-staging:
    # One staging deploy at a time; a newer push waits for the running one instead of colliding with it.
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    needs: [quality, security, semgrep]
    # Only a push to main deploys: the nightly schedule also runs with github.ref == main and must not redeploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with: { role-to-assume: "${{ secrets.AWS_ROLE_STAGING }}", aws-region: eu-west-2 }
      - name: lightsailctl plugin
        run: go install github.com/aws/lightsailctl@v1.0.8 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH" # pinned; the Go checksum database verifies the module
      - id: deploy
        run: PROJECT_NAME=${{ vars.PROJECT_NAME }} infra/deploy.sh staging
      - run: EXPECTED_VERSION=${{ steps.deploy.outputs.version }} infra/smoke.sh ${{ vars.STAGING_URL }}
  deploy-prod:
    needs: [quality, security, semgrep]
    # Defense in depth only. A tag runs the workflow file of the tagged commit, so a writer could drop this `if`; the real
    # gate is AWS: the prod role trusts only an OIDC subject that carries the approver (infra/README "Production gate").
    # Required reviewers on private repositories need GitHub Enterprise. Empty or unset PROD_APPROVER = never deploys.
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.PROD_APPROVER != ''
      && github.actor == vars.PROD_APPROVER && github.triggering_actor == vars.PROD_APPROVER
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with: { role-to-assume: "${{ secrets.AWS_ROLE_PROD }}", aws-region: eu-west-2 }
      - name: lightsailctl plugin
        run: go install github.com/aws/lightsailctl@v1.0.8 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH" # pinned; the Go checksum database verifies the module
      - run: PROJECT_NAME=${{ vars.PROJECT_NAME }} infra/deploy.sh prod
      - run: infra/smoke.sh ${{ vars.PROD_URL }}
  zap-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: write }
    steps:
      - uses: zaproxy/action-baseline@0619037bb784a56e2e06b104f0ebe157e076f075 # v0.13.0
        with: { target: "${{ vars.STAGING_URL }}" }
