name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule: [{ cron: "0 3 * * *" }]
# Least privilege: the workflow token can only read. `id-token: write` (OIDC to AWS) is granted to the deploy jobs only.
permissions: { contents: read }
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres: { image: postgres:16-alpine, env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }, ports: ["5432:5432"], options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10 }
      redis: { image: redis:7-alpine, ports: ["6379:6379"] }
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-chars
      APP_URL: http://localhost:5173
      OPS_EMAIL: ops@ci.invalid
      INTEGRATIONS_MODE: fake
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Workspace packages must be built (dist + .d.ts) before apps/api typechecks against them.
      - run: pnpm db:generate && pnpm --filter "./packages/**" build && pnpm db:migrate
      - name: Migrations replay on an empty PostgreSQL (PGlite) in order
        run: pnpm --filter @octavolab/db validate:sql
      - run: pnpm lint && pnpm typecheck
      - name: Integration tests against PostgreSQL (real database, migrations applied)
        run: INTEGRATION=1 pnpm --filter api test:int
      - run: pnpm test
      - name: Migrations exist and are applied (Prisma has no down migrations; rollback plan per migration in its folder)
        run: test -n "$(ls packages/db/prisma/migrations 2>/dev/null)" && pnpm --filter @octavolab/db exec prisma migrate status && pnpm --filter @octavolab/db exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: pnpm build
      - name: E2E (390/768/1024/1440 + axe); vite preview proxies /api to the API on :3000
        run: |
          pnpm --filter api start & pnpm --filter web preview --port 5173 --strictPort &
          sleep 5
          E2E_BASE_URL=http://localhost:5173 API_URL=http://localhost:3000 pnpm exec playwright install --with-deps chromium webkit && pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report }
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # gitleaks-action requires a paid GITLEAKS_LICENSE for organisation repos; the CLI in its official image does not.
      - name: gitleaks (CLI, full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact -v
      # osv-scanner exits non-zero when it finds vulnerabilities; there is no --fail-on-vuln flag.
      - name: osv-scanner (pnpm lockfile)
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v1.9.1 --lockfile=/src/pnpm-lock.yaml
      - name: build image
        run: docker build -f infra/Dockerfile -t app:ci .
      - name: trivy
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: app:ci, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
  semgrep:
    # semgrep/semgrep-action is archived; the official container runs the CLI directly.
    runs-on: ubuntu-latest
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/owasp-top-ten --error
  deploy-staging:
    needs: [quality, security, semgrep]
    # Only a push to main deploys: the nightly schedule also runs with github.ref == main and must not redeploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_ROLE_STAGING }}", aws-region: eu-west-2 }
      - name: lightsailctl plugin
        run: curl -fsSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o /usr/local/bin/lightsailctl && chmod +x /usr/local/bin/lightsailctl
      - run: PROJECT_NAME=${{ vars.PROJECT_NAME }} infra/deploy.sh staging
      - run: infra/smoke.sh ${{ vars.STAGING_URL }}
  deploy-prod:
    needs: [quality, security, semgrep]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production   # requires manual approval in GitHub + Jaime's approval in chat (N07)
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_ROLE_PROD }}", aws-region: eu-west-2 }
      - name: lightsailctl plugin
        run: curl -fsSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o /usr/local/bin/lightsailctl && chmod +x /usr/local/bin/lightsailctl
      - run: PROJECT_NAME=${{ vars.PROJECT_NAME }} infra/deploy.sh prod
      - run: infra/smoke.sh ${{ vars.PROD_URL }}
  zap-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: write }
    steps:
      - uses: zaproxy/action-baseline@v0.13.0
        with: { target: "${{ vars.STAGING_URL }}" }
